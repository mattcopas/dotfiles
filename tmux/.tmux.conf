# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind Space send-prefix

# Start indexing windows at 1, not 0
set -g base-index 1
# Set escape time to 20ms
set -g escape-time 20

# Enable mouse support
set -g mouse on

# Dont auto rename windows based on process
# Can use <prefix>, to rename current window
set-option -g allow-rename off

# Sane split commands
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Use hjkl, Ctrl-d, Ctrl-u etc in scroll mode
# to get to scroll model hiy Ctrl-b [
set-window-option -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Sort out colours
set -g default-terminal "screen-256color"

# Make status bar transparent
set -g status-style bg=default

# TMUX Plugins

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-resurrect'
# Automatically save tmux sessions every 15 minutes, and restore them automatically.
# Removes the need to do manually use tmux-resurrect
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
# Restore shell history and neovim sessions
set -g @resurrect-strategy-nvim 'session'

# Alternative to tmux-thumbs because tmux-thumbs doesn't work on Apple Silicone
set -g @plugin 'laktak/extrakto'
set -g @extrakto_key 'f'


set -g @plugin 'christoomey/vim-tmux-navigator'
# TODO session manager improvements? (devops toolbox sesh plugin?)

# This line MUST be the last one!
run '~/.tmux/plugins/tpm/tpm'
